name: thix_id
description: "THIX ID - Une identité numérique sécurisée"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  go_router: ^16.3.0
  fl_chart: ^0.68.0

  # Backend (Supabase only)
  supabase_flutter: ^2.14.1
  realtime_client: ^2.7.3

  # Utils & Storage
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Media & Communication
  video_player: ^2.9.2
  agora_rtc_engine:
    version: ^6.3.0
    platforms:
      android: null
      ios: null
  record:
    version: ^5.1.2
    platforms:
      android: null
      ios: null

  # Identification & Scanning
  geolocator:
    version: ^13.0.4
    platforms:
      android: null
      ios: null
  nfc_manager:
    version: ^4.0.0
    platforms:
      android: null
      ios: null
  mobile_scanner:
    version: ^7.0.0
    platforms:
      android: null
      ios: null
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.0

  # Notifications & Sharing
  flutter_local_notifications:
    version: ^20.0.0
    platforms:
      android: null
      ios: null
  permission_handler:
    version: ^12.0.0
    platforms:
      android: null
      ios: null
  share_plus: ^10.0.0

  # Files & PDF
  file_picker: ^8.1.2
  printing: ^5.13.0
  pdf: ^3.11.0

  # Security & Others
  crypto: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/dreamflow_icon.jpg"
  remove_alpha_ios: true
